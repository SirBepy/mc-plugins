# The overworld is the default; difficulty tiers below can also send balls to the Nether/End.
world: world
nether-world: world_nether
end-world: world_the_end

scatter:
  # Chunks are pregenerated out to +/-4900 on each axis (overworld) and +/-1200 (nether); a ball must
  # land inside that square so its chunk is already there (no world-gen hitch when a player
  # approaches an uncharted edge ball). The End is exempt: its outer islands aren't pregenerated.
  pregen-limit: 4900
  nether-pregen-limit: 1200
  # Balls stay at least this far apart from each other, so a lucky player can't grab two in one trip.
  # Enforced separately per dimension (an overworld ball and a nether ball never compete for space).
  min-spacing: 200
  # Resamples a brand-new random point this many times before falling back to a shore search near
  # the last candidate, so an unlucky run of ocean rolls doesn't stall the scatter.
  max-liquid-resamples: 20
  # The End's outer islands, searched 1000-3000 blocks from 0,0 regardless of difficulty tier.
  end-min-distance: 1000
  end-max-distance: 3000

# The hunt gets harder after every granted wish. Indexed by wishCount (0 = before any wish has ever
# been granted), clamped to the last entry once wishCount runs past the list. min/max-radius are the
# overworld scatter annulus around the summon point; the Nether reuses the same radius divided by 8
# (its coordinates are 1/8 scale); the End always uses end-min/max-distance from 0,0 regardless of
# tier. nether/end are how many of the 7 balls go to that dimension each scatter (the rest stay in
# the overworld); which stars go where is picked at random each time.
difficulty:
  - { min-radius: 1000, max-radius: 2000, nether: 0, end: 0 }
  - { min-radius: 1000, max-radius: 3000, nether: 0, end: 0 }
  - { min-radius: 1500, max-radius: 4000, nether: 0, end: 0 }
  - { min-radius: 1500, max-radius: 4000, nether: 1, end: 0 }
  - { min-radius: 2000, max-radius: 4500, nether: 2, end: 0 }
  - { min-radius: 2000, max-radius: 4500, nether: 2, end: 1 }

# Fraction of walking speed lost per carried ball (any slot, including offhand/cursor), stacked
# linearly via one MULTIPLY_SCALAR_1 attribute modifier: 7 balls = 7 * 0.05 = -35%.
slow-per-ball: 0.05

stone:
  # minecraft-days counts in-game days (sleeping skips count, same as Market's sign rotation);
  # real-hours counts real wall-clock time regardless of whether the server was up the whole time.
  mode: minecraft-days
  days: 3
  real-hours: 24

# A holder offline this long has their ball re-scattered around the last summon location.
logout-hours: 24

messages:
  found: "<gold><player> found the <star>-Star Dragon Ball!"
  reload-success: "<green>DragonBalls config reloaded."
  scatter-success: "<green>Scattered all 7 Dragon Balls."
  give-success: "<green>Gave the <star>-Star Dragon Ball to <player>."
