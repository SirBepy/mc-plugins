# The overworld is the default; difficulty tiers below can also send balls to the Nether/End.
world: world
nether-world: world_nether
end-world: world_the_end

scatter:
  # Chunks are pregenerated out to +/-4900 on each axis (overworld) and +/-1200 (nether); a ball must
  # land inside that square so its chunk is already there (no world-gen hitch when a player
  # approaches an uncharted edge ball). The End is exempt: its outer islands aren't pregenerated.
  pregen-limit: 4900
  nether-pregen-limit: 1200
  # Balls stay at least this far apart from each other, so a lucky player can't grab two in one trip.
  # Enforced separately per dimension (an overworld ball and a nether ball never compete for space).
  min-spacing: 200
  # Resamples a brand-new random point this many times before falling back to a shore search near
  # the last candidate, so an unlucky run of ocean rolls doesn't stall the scatter.
  max-liquid-resamples: 20
  # The End's outer islands, searched 1000-3000 blocks from 0,0 regardless of difficulty tier.
  end-min-distance: 1000
  end-max-distance: 3000
  # Per scatterAll of the overworld set: this many (random, distinct) stars go down a carved shaft
  # instead of landing on the surface, this many (different) stars go to a point of interest; the
  # rest are plain surface placements. The Nether set only uses poi-count (fortress/bastion); the End
  # set uses neither.
  underground-count: { min: 1, max: 2 }
  # How many blocks below the ground block the shaft's bottom chamber sits.
  underground-depth: { min: 10, max: 30 }
  poi-count: { min: 1, max: 2 }
  # World#locateNearestStructure's own search radius, in chunks, capped so one scatter never stalls
  # the server for long.
  poi-search-radius-chunks: 32
  # How many of the structures below get tried (in random order) before a POI star falls back to a
  # plain surface placement.
  poi-attempts: 3
  poi-structures:
    overworld:
      - village_plains
      - village_desert
      - village_savanna
      - village_snowy
      - village_taiga
      - pillager_outpost
      - ruined_portal
      - ruined_portal_desert
      - ruined_portal_jungle
      - ruined_portal_mountain
      - ruined_portal_swamp
      - desert_pyramid
      - jungle_pyramid
      - igloo
      - swamp_hut
    nether:
      - fortress
      - bastion_remnant

# The hunt gets harder after every granted wish. Indexed by wishCount (0 = before any wish has ever
# been granted), clamped to the last entry once wishCount runs past the list. min/max-radius are the
# overworld scatter annulus around the summon point; the Nether set reuses the same radius divided
# by 8 (its coordinates are 1/8 scale) around its own summon point; the End set always uses
# end-min/max-distance from 0,0 regardless of tier. Each of the 3 sets always scatters all 7 of its
# own balls in its own home dimension - there is no cross-dimension split anymore, so an old
# config.yml's "nether"/"end" per-tier keys (the old split scheme) are simply ignored if present.
difficulty:
  - { min-radius: 1000, max-radius: 3000 }
  - { min-radius: 1500, max-radius: 3500 }
  - { min-radius: 1500, max-radius: 4000 }
  - { min-radius: 2000, max-radius: 4500 }

# Fraction of walking speed lost per carried ball (any slot, including offhand/cursor), stacked
# linearly via one MULTIPLY_SCALAR_1 attribute modifier: 7 balls = 7 * 0.05 = -35%.
slow-per-ball: 0.05

stone:
  # minecraft-days counts in-game days (sleeping skips count, same as Market's sign rotation);
  # real-hours counts real wall-clock time regardless of whether the server was up the whole time.
  mode: minecraft-days
  days: 3
  real-hours: 24

# A holder offline this long has their ball re-scattered around the last summon location.
logout-hours: 24

messages:
  found: "<gold><player> found the <star>-Star Dragon Ball!"
  found-nether: "<gold><player> found the <star>-Star Nether Dragon Ball!"
  found-end: "<gold><player> found the <star>-Star End Dragon Ball!"
  reload-success: "<green>DragonBalls config reloaded."
  scatter-success: "<green>Scattered all 7 Dragon Balls."
  give-success: "<green>Gave the <star>-Star Dragon Ball to <player>."
  # Shown (action bar) when a ball's set is ready but the main hand isn't holding that exact set's
  # radar - no radar at all, or a different set's radar (which is never spent on a wrong-set click).
  no-radar: "<gray>The balls stir... but need a Dragon Radar."
  no-radar-nether: "<gray>The balls stir... but need a Nether Dragon Radar."
  no-radar-end: "<gray>The balls stir... but need an End Dragon Radar."
  end-radar-closed: "<red>The End is closed. The End Radar sleeps until it opens."
  ball-stays-behind: "<gray>Your <name> stays behind: it won't leave <home>."

# The Dragon Ball station at spawn (built by the spawn-market datapack; coordinates come from
# server/spawn-market/dragonballs-station.json).
station:
  radar-signs:
    overworld: { world: world, x: 413, y: 116, z: -873, price: 1000 }
    nether: { world: world, x: 413, y: 116, z: -875, price: 5000 }
    end: { world: world, x: 413, y: 117, z: -874, price: 20000 }
  display-heads:
    - { world: world, x: 415, y: 116, z: -873 }
    - { world: world, x: 415, y: 116, z: -874 }
    - { world: world, x: 415, y: 116, z: -875 }
    - { world: world, x: 415, y: 116, z: -871 }
    - { world: world, x: 414, y: 116, z: -871 }
    - { world: world, x: 415, y: 116, z: -877 }
    - { world: world, x: 414, y: 116, z: -877 }

summon:
  # Every ball must be within this many blocks (on each axis) of the one right-clicked.
  radius: 2
  # A dragon nobody talks to (no summoner chat, no /shenron command) leaves after this long.
  idle-timeout-seconds: 600
  summoner-offline-seconds: 180

effects:
  # Blocks above the balls' centre where the Overworld/End dragon hovers, and its size (1.0 =
  # vanilla Ender Dragon). The Nether dragon ignores dragon-height: it scans upward for the
  # cavern ceiling instead (see the nether- keys below).
  dragon-height: 18.0
  dragon-scale: 1.0
  # The Nether dragon's size, and how it's placed under a cavern ceiling: scan up to
  # nether-max-height blocks for the first solid block, try to keep nether-ceiling-clearance
  # blocks of headroom above the scaled body, prefer nether-min-height when the ceiling is close,
  # but never let the body poke into the ceiling itself.
  nether-dragon-scale: 0.5
  nether-max-height: 18.0
  nether-ceiling-clearance: 2.0
  nether-min-height: 3.0
  # Particle counts for the Nether's smoke-and-ember column and the End's purple aura, emitted a
  # few times a second for as long as the dragon is up.
  nether-smoke-particle-count: 8
  nether-ember-particle-count: 4
  end-aura-particle-count: 6
