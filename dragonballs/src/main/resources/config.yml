# Where a set's balls land after a scatter. One flat ring for every scatter (Joe, 2026-10-08: the
# rings that grew after each wish made the Overworld hunt too long). min/max-radius are the overworld
# scatter annulus around the summon point; the Nether set reuses the same radius divided by 8 (its
# coordinates are 1/8 scale) times scatter.nether-radius-multiplier around its own summon point; the
# End set always uses end-min/max-distance from 0,0. The list form stays so growth can come back:
# entry N is used once a set has N granted wishes, the last entry after that. An old config.yml's
# "nether"/"end" per-entry keys (the old dimension-split scheme) are ignored.
difficulty:
  - { min-radius: 1000, max-radius: 2000 }

# Fraction of walking speed lost per carried ball (any slot, including offhand/cursor), stacked
# linearly via one MULTIPLY_SCALAR_1 attribute modifier: 7 balls = 7 * 0.05 = -35%.
slow-per-ball: 0.05

stone:
  # minecraft-days counts in-game days (sleeping skips count, same as Market's sign rotation);
  # real-hours counts real wall-clock time regardless of whether the server was up the whole time.
  mode: minecraft-days
  days: 3
  real-hours: 24

messages:
  found: "<gold><player> found the <star>-Star Dragon Ball!"
  found-nether: "<gold><player> found the <star>-Star Nether Dragon Ball!"
  found-end: "<gold><player> found the <star>-Star End Dragon Ball!"
  reload-success: "<green>DragonBalls config reloaded."
  scatter-success: "<green>Scattered all 7 Dragon Balls."
  give-success: "<green>Gave the <star>-Star Dragon Ball to <player>."
  # Shown (action bar) when a ball's set is ready but the main hand isn't holding that exact set's
  # radar - no radar at all, or a different set's radar (which is never spent on a wrong-set click).
  no-radar: "<gray>The balls stir... but need a Dragon Radar."
  no-radar-nether: "<gray>The balls stir... but need a Nether Dragon Radar."
  no-radar-end: "<gray>The balls stir... but need an End Dragon Radar."
  end-radar-closed: "<red>The End is closed. The End Radar sleeps until it opens."
  ball-stays-behind: "<gray>Your <name> stays behind: it won't leave <home>."
  balls-dropped-on-join: "<gray>Your Dragon Balls dropped at your feet: they never stay with you while you're logged out."
  ball-returned: "<gray>Your <star>-Star Dragon Ball slipped out of your inventory and dropped at your feet."
  # <set> is "" for the Overworld, else "Nether " / "End ".
  ball-left-town: "<gold>The <star>-Star <set>Dragon Ball can't stay inside a town, so it rolled out to <x>, <y>, <z>."

