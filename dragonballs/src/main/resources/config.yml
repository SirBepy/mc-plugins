# The overworld is the default; difficulty tiers below can also send balls to the Nether/End.
world: world
nether-world: world_nether
end-world: world_the_end

scatter:
  # Chunks are pregenerated out to +/-4900 on each axis (overworld) and +/-1200 (nether); a ball must
  # land inside that square so its chunk is already there (no world-gen hitch when a player
  # approaches an uncharted edge ball). The End is exempt: its outer islands aren't pregenerated.
  pregen-limit: 4900
  nether-pregen-limit: 1200
  # The Nether set's tier radii are the overworld ones at 1/8 scale times this (Joe, 2026-10-08:
  # 2.0, so the 1000-2000 ring is 250-500 Nether blocks). Keep max-radius / 8 * this under nether-pregen-limit
  # or the scatter centre gets pinned to 0,0. Ball spacing stays min-spacing / 8.
  nether-radius-multiplier: 2.0
  # Balls stay at least this far apart from each other, so a lucky player can't grab two in one trip.
  # Enforced separately per dimension (an overworld ball and a nether ball never compete for space).
  min-spacing: 200
  # Resamples a brand-new random point this many times before falling back to a shore search near
  # the last candidate, so an unlucky run of ocean rolls doesn't stall the scatter.
  max-liquid-resamples: 20
  # The End's outer islands, searched 1000-3000 blocks from 0,0 regardless of difficulty tier.
  end-min-distance: 1000
  end-max-distance: 3000
  # Every ball lands inside a generated structure (Joe, 2026-10-08; 2026-10-09: "always prioritize
  # putting it in a structure"): in a room, on a roof or on a street of one of the structures listed below for its
  # set, found with locateNearestStructure around random points of the set's ring. If none fits the
  # ring, the search repeats once with the ring widened (a quarter of the min radius, 2x the max);
  # only then does a ball land on plain ground (logged). locateNearestStructure never generates a new
  # chunk here (its findUnexplored flag is off), so widening costs nothing extra in chunk loads: a
  # wider ring just searches more of what's already generated inside pregen-limit.
  # A bare id is vanilla; datapack ids carry their namespace. Unknown ids are skipped.
  # World#locateNearestStructure's own search radius around each origin point, in chunks.
  structure-search-radius-chunks: 32
  # Random points of the ring a star searches from (per round), and how many structure types are
  # tried around each one (a fresh shuffle each time, so no type dominates).
  structure-origins-per-star: 4
  structures-per-origin: 8
  # Searches run on one server tick; the rest wait for the next, so a scatter never stalls the server.
  structure-searches-per-tick: 2
  # Pieces of one found structure checked for a free spot, and the most chunks a piece may span
  # (each is loaded before its blocks are read).
  structure-pieces-tried: 8
  structure-piece-max-chunks: 16
  structures:
    # Surface buildings and dungeons: vanilla, Terralith, Structory, Structory: Towers, Dungeons and
    # Taverns, plus vanilla's underwater structures (Joe, 2026-10-09: "underwater structures work
    # too") - ocean ruins, shipwrecks and the ocean monument. No mineshafts.
