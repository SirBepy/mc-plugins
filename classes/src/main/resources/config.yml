# GutGr1nder's RPG classes wish (Overworld Shenron, granted 2026-10-10 17:20 UTC). docs/classes.md
# has the full terms and every class's numbers.

# Class XP one player can earn per day (all classes together; only the active class earns). Levels
# 1 -> 25 take 3960 XP, so a player at the cap every day reaches 25 in about two weeks.
daily-xp-cap: 300

# Whose day the cap resets on: midnight in this zone.
zone: Europe/Zagreb

# Real days between class changes. The first pick is free, and so is going back to the class you
# last left with /class leave.
change-days: 7

# Dual-classing wish grant (Sivra21, 9366f4f8-b61e-4612-8644-f626a9a378bb, Overworld Shenron
# 2026-10-11): these players may pick ONE permanent secondary class with /class secondary <class>,
# giving half its passive and the full weakness, no ability, alongside their normal main class.
# Revoke by removing the UUID here and restarting; their stored pick stays saved but stops counting.
dual-class-grants:
  - "9366f4f8-b61e-4612-8644-f626a9a378bb"

# Paint the tree menu's background with the server resource pack's classes:tree font (Java only).
# Leave off until the pack with the tree glyphs is live, or players see boxes in the title.
tree-background: false

# Show each ability as its icon in the boss-bar spell bar, drawn by the server resource pack's
# classes:icons font (Java only). Same rule: leave off until that pack is live.
ability-icons: false
