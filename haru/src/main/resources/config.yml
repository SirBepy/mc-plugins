# Haru, Keeper of the Sakura Sanctuary: ImMijo's Shenron wish (granted 2026-10-06). Design notes and
# every hidden reward: docs/haru.md. Haru's spot is set in-game with /haru place and kept in data.yml.

# The only player Haru trades with, gives quests to and keeps reputation for. Others get a polite line.
owner: 8c0c13b9-057a-4ac8-aacf-7b6c77f8742b

# "Daily" things (quest board, Mystery Curio, Secret Stock week) roll over at midnight here.
timezone: Europe/Zagreb

# Wandering Wares change every this many Minecraft days of this world's clock.
world: world
rotation-days: 3

# Chance that a rotation also brings a Legendary Trade (Joe: about 1 rotation in 5).
legendary-chance: 0.2

# Java players see Haru as a player-shaped Mannequin wearing this skin (Bedrock players see a cleric
# villager). texture: the hash from http://textures.minecraft.net/texture/<hash>, visible to every Java
# client. pack-texture / pack-cape: textures in the server resource pack, drawn instead; with these set,
# players whose pack declined or failed see the villager instead. model: wide or slim.
# Applied by /haru reload.
skin:
  texture: ""
  pack-texture: claudesmp:entity/haru
  pack-cape: claudesmp:entity/haru_cape
  model: wide
