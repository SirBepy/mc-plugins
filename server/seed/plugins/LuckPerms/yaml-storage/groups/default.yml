name: default
# EssentialsX takes over vanilla /msg /r /list /me /help, so those need its own nodes to keep working.
# The false nodes switch off HuskHomes and QuickShop extras that default to everyone (or come with the
# quickshop.player bundle); admin.yml re-grants them, since an inherited explicit false beats admin's '*'.
permissions:
# Simple Voice Chat declares these in plugin.yml with no default, which Bukkit treats as op-only, so
# non-op players had no voice chat until they were granted here.
- voicechat.listen
- voicechat.speak
- voicechat.groups
- pvpmanager.command.pvp
- quickshop.player
- quickshop.browse.teleport:
    value: false
- quickshop.tag.tagged.teleport:
    value: false
- essentials.balance
- essentials.balancetop
- essentials.pay
# The spawn market is admin-made Essentials [Sell]/[Buy] signs; only admins (via '*') create them.
- essentials.signs.use.sell
- essentials.signs.use.buy
- essentials.msg
- essentials.r
- essentials.list
- essentials.me
- essentials.help
- essentials.afk
- essentials.afk.auto
- essentials.ignore
- essentials.seen
- essentials.mail
- essentials.mail.send
# EssentialsX keeps the inventory/XP of anyone holding these, which '*' grants admins; inherited false
# here makes death drop everything for every group, admin included.
- essentials.keepinv:
    value: false
- essentials.keepxp:
    value: false
- huskhomes.max_homes.3
- huskhomes.command.rtp:
    value: false
# Everyone can /warp and /warplist (Joe, 2026-10-09).
- huskhomes.command.warp
- huskhomes.command.warplist
- huskhomes.command.phome:
    value: false
- huskhomes.command.phomelist:
    value: false
- huskhomes.command.edithome.privacy:
    value: false
