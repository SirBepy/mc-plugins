# Per-world Paper config for the Nether, overriding config/paper-world-defaults.yml.
# Anti-xray: Paper's own Nether recommendation for engine-mode 3 (docs.papermc.io/paper/anti-xray).
# The Overworld's lists hide stone ores, which the Nether has none of; this hides debris, quartz
# and gold up to y 128 among netherrack-family fakes instead.

_version: 31
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 3
    hidden-blocks:
    - air
    - ancient_debris
    - bone_block
    - glowstone
    - magma_block
    - nether_bricks
    - nether_gold_ore
    - nether_quartz_ore
    - polished_blackstone_bricks
    lava-obscures: false
    max-block-height: 128
    replacement-blocks:
    - basalt
    - blackstone
    - gravel
    - netherrack
    - soul_sand
    - soul_soil
    update-radius: 2
    use-permission: false
