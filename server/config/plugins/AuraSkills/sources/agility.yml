# No walk/sprint/swim sources: AuraSkills pays statistic XP to everyone in one batch every
# source.statistic.gain_period_ticks (10 min), so the whole server levels agility at once while idle.
sources:
  jump_per_100:
    type: jumping
    interval: 100
    xp: 7
    menu_item:
      material: feather
    unit: '{sources.units.100_jumps}'
  fall_damage:
    type: damage
    xp: 1.4
    cause: fall
    must_survive: true
    use_original_damage: true
    menu_item:
      material: diamond_boots
    unit: '{sources.units.damage}'
