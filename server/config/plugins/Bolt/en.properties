# User-defined translation override (Bolt reads every *.properties file directly in its
# data folder root and merges it over the built-in lang/en.properties, keyed by locale name,
# see org.popcraft.bolt.lang.Translator#loadAllTranslations and BoltPlugin#onEnable).
#
# Blanks Bolt's own "locked" message (normally "This <protection> is locked with a magical
# spell.") because SafeChests already tells the requester who owns the chest and offers a
# [Request access] button; showing both would be redundant. Bolt's BoltComponents#sendMessage
# skips sending entirely when the resolved component equals Component.empty(), so an empty
# value here means nothing is sent, not a blank chat line.
locked=
#
# Blanks the "This Private chest is locked by <player>/you" notice Bolt sends to the owner and
# trusted players on every open; it repeats on each chest access and tells them nothing new.
protection_notify=
protection_notify_generic=
