# Geyser-Spigot config, reconstructed from org.geysermc.geyser.configuration.GeyserConfig.java
# rather than copied from a real generated file. The release build (2.11.3 / 1247) fails to enable
# on Paper 26.3 build 143 beta ("Couldn't find asBukkitCopy or asCraftMirror method on
# CraftItemStack", a shaded cloud command library incompatibility with Paper 26.3's CraftItemStack
# changes, tracked upstream in GeyserMC/Geyser#6716/#6730); ServerArtifacts.kt pins GeyserMC's own
# official preview build of the fix instead (GeyserMC/Geyser#6712 "Update to Java 26.3", open/
# unmerged as of 2026-10-10, preview project "geyserpreview" pr.6712 build 3090; that build rewrites
# this file to its config-version 9 layout on first boot). Swap the pin back
# to a normal "geyser" release build once 26.3 support ships there; once it does, this file can also
# be deleted and replaced by Geyser's own first-boot-generated config, diffed and re-committed.
#
# Values below are Geyser's own documented defaults except auth-type (floodgate, so Bedrock
# players authenticate through Floodgate instead of a separate Microsoft/offline login), and the
# bedrock listener port. java.port is not actually used as configured: for the plugin platform (as
# opposed to Standalone), Geyser always overrides java.address/java.port from Bukkit.getPort() at
# startup (GeyserImpl#start, "platformType != STANDALONE" branch), so it automatically follows
# whatever server-port the Paper server itself binds to, with no override needed here.
#
# bedrock.port is 25572 (Kinetic Panel allocation [42267], noted "geyser-bedrock"), not Geyser's
# default 19132: Kinetic only opens the allocations it assigns, so Bedrock clients must connect on
# the assigned port, not the UDP default (see server/deploy/KINETIC.md).
#
# NetherNet (https://geysermc.org/blog/preparing-for-nethernet): Bedrock 26.60 (shipping
# 2026-10-27) requires NetherNet transport; a RakNet-only Geyser stops being reachable from that
# client version onward. transport: both keeps RakNet (today's clients, and this repo's
# e2e/bedrock.mjs, which uses the "bedrock-protocol" npm lib - RakNet only, no NetherNet support)
# working side by side with NetherNet. webrtc-port must be a distinct, nonzero UDP port from
# "port" in "both" mode (Geyser docs: "both" needs its own UDP port per transport; 0 would make
# NetherNet reuse "port", colliding with RakNet's own UDP use of that same port). signaling stays
# at its "builtin" default: Geyser runs its own TCP signaling server on bedrock.port, which is
# fine here since clone-remote-port is false (Java and Bedrock aren't sharing a port).
#
# LIVE DEPLOY NOT DONE YET: the live server still needs (1) a new Kinetic Panel UDP allocation for
# webrtc-port (25573 below is a placeholder, not yet allocated - see server/deploy/KINETIC.md's
# allocation table, pick the next free one with Joe before deploy), and (2) TCP opened on the
# existing 25572 allocation for builtin signaling (today it's presumably UDP-only for RakNet) -
# verify with Joe/Kinetic before relying on it. Needs Joe's explicit go-ahead; do not apply to live
# from this change alone.
bedrock:
  address: 0.0.0.0
  port: 25572
  webrtc-port: 25573
  transport: both
  clone-remote-port: false
  enable-proxy-protocol: false
  proxy-protocol-whitelisted-ips: []
java:
  address: 127.0.0.1
  port: 25565
  auth-type: floodgate
  forward-hostname: false
motd:
  primary-motd: Geyser
  secondary-motd: Another Geyser server.
  passthrough-motd: true
  max-players: 100
  passthrough-player-counts: true
  integrated-ping-passthrough: true
  ping-passthrough-interval: 3
gameplay:
  server-name: Geyser
  cooldown-type: crosshair
  command-suggestions: true
  show-coordinates: true
  disable-bedrock-scaffolding: false
  nether-roof-workaround: false
  emotes-enabled: true
  block-legacy-codes: true
  unusable-space-block: minecraft:barrier
default-locale: system
log-player-ip-addresses: true
saved-user-logins: []
pending-authentication-timeout: 120
notify-on-new-bedrock-update: true
# The advanced/NetherNet-signaling block (mtu, caching, direct-io, etc.) is left out entirely:
# its exact default values were not verified against a real generated file (see header note),
# so Geyser will fill it in with its own defaults on first successful boot instead of us guessing.
debug-mode: false
config-version: 8
