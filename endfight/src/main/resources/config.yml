# EndFight phase 1: the arena structures around the End's 10 end-spike pillars and the cult
# fortress ring around the exit portal - their protection, and rebuilding them after a dragon
# respawn regenerates the pillars. Later phases add the illager cult (guards/waves) and rewards.

arena:
  # Build the arena automatically the first time the End world is seen: on enable if it already
  # exists, or the moment it loads later (e.g. live flips allow-end on and restarts). Never builds
  # a second time on its own - state.yml remembers. Set false to require a manual `endfight build`.
  auto-build: true

rewards:
  # Phase 3: every participant who damaged the dragon gets XP (by tier, below) and - once a week
  # per tier - a Dragon Hoard. See docs/endfight.md's Rewards section. Live for the first fight
  # (Joe, 2026-10-09, Saturday 2026-10-10); false falls all the way back to vanilla (no orb
  # sweeping, no hoards, no pending deliveries).
  enabled: true

  # Joe's reward spec (2026-10-09): XP (always given, never weekly-limited) and a Dragon Hoard's
  # raw materials (always in the hoard) plus its armor-roll chance - 1.0 means guaranteed; 1.5
  # (Ascended only) means guaranteed plus a 50% chance at a second roll. scrap-min/scrap-max are
  # the netherite scrap range (0/0 = never any scrap). Every field below is the approved default;
  # only override what Joe explicitly changes.
  tiers:
    fledgeling:
      xp: 500
      diamonds: 2
      shells: 2
      gapples: 0
      scrap-min: 0
      scrap-max: 0
      roll-chance: 0.10
    powerful:
      xp: 750
      diamonds: 3
      shells: 2
      gapples: 1
      scrap-min: 0
      scrap-max: 0
      roll-chance: 0.15
    cruel:
      xp: 1000
      diamonds: 4
      shells: 4
      gapples: 1
      scrap-min: 0
      scrap-max: 0
      roll-chance: 0.25
    immortal:
      xp: 1500
      diamonds: 6
      shells: 4
      gapples: 2
      scrap-min: 0
      scrap-max: 0
      roll-chance: 0.50
    ferocious:
      xp: 2000
      diamonds: 8
      shells: 6
      gapples: 2
      scrap-min: 0
      scrap-max: 0
      roll-chance: 0.75
    primordial:
      xp: 3000
      diamonds: 9
      shells: 6
      gapples: 3
      scrap-min: 1
      scrap-max: 2
      roll-chance: 1.00
    ascended:
      xp: 4000
      diamonds: 10
      shells: 6
      gapples: 4
      scrap-min: 1
      scrap-max: 2
      roll-chance: 1.50

  # The server's actual first-ever dragon kill: the Ferocious row's materials, a guaranteed roll,
  # and 12000 XP instead of Ferocious's 2000.
  first-kill:
    xp: 12000
    roll-chance: 1.0

tiers:
  # The altar's pick before anyone has ever touched it, and what a fresh plugins/EndFight/tier.yml
  # starts from. The server's actual first-ever dragon is still forced to Ferocious regardless of
  # this (and of the altar) - see docs/endfight.md's Altar & tiers section.
  default: FLEDGELING

  # How long after a fresh dragon spawns EndFight waits before pushing the locked tier onto it.
  # Dragonkind Evolved ticks every dragon once a second looking for one it hasn't started yet
  # (see DkeTierPusher's class docs); this needs to stay comfortably past that 20-tick window so
  # DKE has already started the dragon before EndFight's own push lands on top of it.
  apply-delay-ticks: 60

  dke:
    # null (default) auto-detects Dragonkind Evolved through Bukkit's datapack list (matching a
    # pack name containing "dke" or "dragonkind"); set true/false here if live's actual datapack
    # filename matches neither and auto-detect guesses wrong.
    force-installed:

messages:
  reload-success: "<green>EndFight config reloaded."
  build-success: "<green>Arena built: <pillars> pillars, <blocks> blocks."
  build-failed: "<red>Could not build the arena; see console."
  clear-success: "<green>Arena cleared."
  clear-failed: "<red>Could not clear the arena; see console."
  reward-delivered: "<gold>The dragon's hoard: <xp> XP and a Dragon Hoard went to your <where>."
  reward-xp-only: "<gold>The dragon's hoard: <xp> XP (you already have this tier's Dragon Hoard this week)."
  aura-unlocked: "<light_purple>Dragon aura unlocked: <aura>! Wear it with /dragonaura <aura>."
  tier-announce: "<light_purple><player> set the next dragon to <tier>."
  tier-set: "<green>The next dragon will be <tier>."
  tier-locked-first-kill: "<red>The server's first dragon is always Ferocious; the altar is locked until it falls."

# The dragon's army: illager guards on every outpost/balcony/gatehouse/wall and piglins on the
# Nether pillars, plus waves on an HP schedule as the dragon loses health (Joe, 2026-10-09). Every
# part has its own switch, default on.
cult:
  # Cap on live wave mobs at once, queued ones included (guards don't count: there is one per
  # post) - a wave that would push past it just spawns fewer mobs, in entry order.
  max-alive: 150
  # When the dragon dies, every remaining cult mob dies with it in a puff of soul particles, and
  # any wave mobs still queued never come.
  die-with-dragon: true
  guards:
    enabled: true
    # How far (horizontally, from 0,0) a player in the End has to be before guards spawn at all.
    range: 160
    # How often (in ticks) to check for "arena built + dragon alive + a player in range" before
    # spawning guards for the first time this dragon.
    check-interval-ticks: 40
    # How often (in ticks) a guard's tether task re-checks its distance from its own post.
    tether-interval-ticks: 20
    # A guard with no current target wandering more than this many blocks from its post pathfinds
    # straight back to it.
    tether-range: 3
    # A guard teleported back to its post if it fell this far below it with no target...
    fall-teleport-distance: 6
    # ...or wandered this far from it with no target.
    wander-teleport-distance: 24
    # A guard with no player within this many blocks has its AI switched off until one comes
    # back (or something hurts it). Performance: most of ~100 guards are far from any fight.
    sleep-range: 48
    # Base mob per post, plus one bonus mob once per physical outpost/gatehouse (not per post -
    # see GuardPlan's javadoc for how posts are grouped back into outposts/gatehouses). The
    # illager pillars and the fortress: crossbows and axes.
    composition:
      STAIR_OUTPOST:
        base: pillager
        bonus: vindicator
      LADDER_OUTPOST:
        base: pillager
        bonus: vindicator
      BALCONY:
        base: pillager
        bonus: vindicator
      GATEHOUSE:
        base: pillager
        bonus: evoker
      WALL:
        base: pillager
    # The Nether-themed pillars (every other one around the ring).
    nether-composition:
      STAIR_OUTPOST:
        base: piglin
        bonus: piglin_brute
      LADDER_OUTPOST:
        base: piglin
        bonus: piglin_brute
      BALCONY:
        base: piglin
        bonus: piglin_brute
  waves:
    enabled: true
    # How far (horizontally, from 0,0) a player in the End has to be to count as fighting. Only
    # survival/adventure players who are alive count; waves scale with how many there are.
    range: 160
    # A wave's mobs come out over about this many ticks (50 = 2.5 s) instead of all at once.
    spread-ticks: 50
    # New wave mobs wait while the server's average tick time is above this many milliseconds.
    max-mspt: 40
    # Mobs dropped off the dragon start at most this far (horizontally) from the portal, so a
    # dragon out over the void drops them onto the island instead.
    drop-radius: 60
    # Each wave fires once per dragon, the first time its health drops to `at` of its (possibly
    # datapack-raised) max. Entries: `base` mobs of `type`, plus one more per `per-n-players`
    # fighters (1 = per player, 0 = never more). `from`: gates (march out of the fortress gates,
    # default), dragon (dropped off the dragon: Nether troops float down with slow falling,
    # paratroopers glide), or damagers (`base` mobs over each of the top `top-damagers` dragon
    # damage dealers, sent after that player). `announce` is the chat line for the wave.
    schedule:
      - at: 0.90
        announce: "<red>Cult scouts pour out of the fortress gates!"
        entries:
          - { type: pillager, base: 2, per-n-players: 2 }
          - { type: vindicator, base: 1, per-n-players: 3 }
      - at: 0.75
        announce: "<red>A pillager squad marches out, and the dragon drops piglins from the sky!"
        entries:
          - { type: pillager, base: 4, per-n-players: 1 }
          - { type: vindicator, base: 2, per-n-players: 2 }
          - { type: piglin, base: 2, per-n-players: 2, from: dragon }
      - at: 0.50
        announce: "<dark_purple>The dragon calls phantoms down on its fiercest foes!"
        entries:
          - { type: phantom, base: 3, from: damagers, top-damagers: 6 }
          - { type: piglin_brute, base: 1, per-n-players: 4, from: dragon }
      - at: 0.35
        announce: "<red>Evokers and ravagers storm the gates, and brutes fall from the dragon!"
        entries:
          - { type: evoker, base: 1, per-n-players: 4 }
          - { type: ravager, base: 1, per-n-players: 4 }
          - { type: vindicator, base: 2, per-n-players: 2 }
          - { type: piglin_brute, base: 1, per-n-players: 3, from: dragon }
      # The Nether paratroopers: piglin brutes in gold armor gliding off the dragon for its last
      # 15%. Their elytras never drop and they never zombify.
      - at: 0.15
        announce: "<gold>Nether paratroopers leap off the dragon!"
        entries:
          - { type: paratrooper, base: 4, per-n-players: 2, from: dragon }
  # A boss bar under the dragon's counting the army still alive, guards included.
  counter:
    enabled: true
    interval-ticks: 20
  messages:
    # Used for a wave with no `announce` line of its own.
    wave-announce: "<red>The cult answers the dragon's call!"

# Keeps the dragon fighting instead of perching on the exit portal while any pillar's crystal is
# still alive - the fight is meant to end by killing the dragon, not by it landing early.
perch-gate:
  enabled: true
  # How close (blocks) an end crystal has to be to a pillar's own crystal spot to count as "that
  # pillar is still guarded".
  pillar-top-radius: 3
  # Fallback only used if the arena registry has no pillars yet: any crystal within this many
  # blocks horizontally of 0,0...
  fallback-radius: 60
  # ...and above this Y - keeps it from ever matching the 4 crystals players place on the exit
  # portal itself during a respawn, which sit far below this.
  fallback-min-y: 70

# The whole-island reset (Joe, 2026-10-09): every new dragon summon locks players onto the
# obsidian arrival platform, then restores the ENTIRE main island (not just our own structures)
# back to right after the first build - see docs/endfight.md's "Summoning a new dragon" section.
# With no snapshot on disk yet (a fresh install), or with this disabled, nothing here runs and
# RespawnRebuildListener's old per-pillar rebuild behaves exactly as it always has.
reset:
  enabled: true
  # How many block checks a restore spends per tick while putting the island back - keeps a huge
  # restore from freezing the server for one giant tick.
  restore-blocks-per-tick: 40000
  # How often (ticks) the watcher polls DragonBattle#getRespawnPhase().
  poll-interval-ticks: 10
  # How often (ticks) players are swept back onto the platform while a respawn/restore is active.
  lockout-interval-ticks: 20
  # How far (horizontally, from 0,0) in the End counts as "needs to be pulled onto the platform".
  lockout-radius: 80
  # The obsidian arrival platform a locked-out player stands on, facing the island (yaw 90 = west).
  # Defaults are vanilla's own ServerLevel.END_SPAWN_POINT (100, 50, 0), verified by javap against
  # the 26.3 server jar: the player's Y is the platform's own stand height, one block above the
  # obsidian EndPlatformFeature places at y-1.
  platform:
    x: 100.5
    y: 50
    z: 0.5
    yaw: 90
  messages:
    lockout-start: "<red>A new dragon is being summoned. Wait on the platform."
    lockout-teleport: "<yellow>Pulled back to the platform - the island is resetting."
    arena-ready: "<green>The arena is ready."
