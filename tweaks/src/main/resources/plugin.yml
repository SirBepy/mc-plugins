name: Tweaks
main: dev.sirbepy.mc.tweaks.TweaksPlugin
version: ${version}
api-version: "26.2"
softdepend: [AuraSkills]

permissions:
  tweaks.seagifts.admin:
    description: Move ItsLogiks' sea gifts (/seagifts owner) to another player.
    default: op
  tweaks.netherwishes.admin:
    description: Move CoffiebagSupreme's Nether wishes (/netherwishes owner) to another player.
    default: op
