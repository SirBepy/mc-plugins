# Server-list MOTD. Line 1 is fixed so the server stays recognisable in the list; line 2 is one
# entry of `daily-lines`, the same all day (server's local date) and the next entry the day after,
# wrapping around. Edits apply on the next restart. Lines from Joe's player-suggestion form.
motd:
  enabled: true
  first-line: "The Claude SMP"
  daily-lines:
    - "Sirepy"
    - "BOMBORASCLARTPUSSIBOMBOBLOODCLART EGG"
    - "Lovrinac, HEP, HDZ, ZDP, Metkovic, Judini sinovi, Daleko iza devet sela"
    - "PeePeeLooPooPoo"
    - "Danko"
    - "sirbepys sigma kingdom"
    - "the uhh sirbepsters.. or something idk man"
    - "wedge stinks"
    - "shroomsift"
    - "Los pollos minehermanos"
    - "BepyCraft"
    - "Bepy-Craft"

# CoffiebagSupreme's Shenron wish (2026-10-07): fireproof, bigger, faster phantoms, half of them
# venomous and half tougher (PhantomBuffListener). Off = vanilla phantoms after the next restart.
# The 2-night trigger and doubled spawn rate live in config/paper-world-defaults.yml, not here.
phantoms:
  enabled: true

# Loyalty tridents always come back (LoyaltyTridentListener). Bedrock parity (Joe, 2026-10-09): one
# thrown into the void flies back to its thrower instead of being deleted; if the void still takes it,
# the item goes into the owner's inventory. Strays (Joe, 2026-10-11): one that hasn't come back 3 s
# after the throw and is out of ticking range, in another world from its owner, about to unload, or
# owed to an offline or dead owner goes into the owner's inventory (on join or respawn for those two,
# kept in plugins/Tweaks/loyalty-tridents.yml). Tridents without Loyalty stay vanilla. The key's name
# predates the strays. Off = vanilla after the next restart.
void-tridents:
  enabled: true

# dvolic21's Shenron wish (2026-10-09, session gcg0zu): Shenron's Earthbreaker (any item tagged
# claudesmp:earthbreaker, whoever holds it) mines a 5x5 face of natural stone and ores, one block when
# sneaking, at a quarter of the dig speed while the area is on (EarthbreakerListener). Off = a normal
# pickaxe after the next restart.
earthbreaker:
  enabled: true

# Wither anti-cheese (Joe, 2026-10-09; the harder fight itself is the Wither's Wrath datapack): no
# summoning in a Towny town, above the Nether roof, or near bedrock and other blocks it can't break;
# beds, respawn anchors, TNT and End Crystals don't hurt it; a Wither stuck in bedrock, or out of sight
# of every player within 64 blocks for 10 s, appears next to the nearest one (WitherGuardListener).
# Off = vanilla Wither rules after the next restart.
wither-guard:
  enabled: true

# Porunga's sea gifts: permanent Dolphin's Grace and Conduit Power that each owner switches for himself
# with /seagifts dolphin|conduit, each at most once per real hour; death switches both off. Owners:
# ItsLogiks (2026-10-08, session jam0yw) and SirBepy (2026-10-08, session ay4gtv). Switches and cooldowns
# live per owner in plugins/Tweaks/sea-gifts.yml. `seagifts add|remove <player>` edits the list. A single
# `owner:` key from before the list (live's config has one) still counts as an owner; add/remove drop it.
# No `owner:` default here: the jar's defaults are read for any key the server's file lacks, so one here
# would keep that player an owner past every `seagifts remove`.
sea-gifts:
  enabled: true
  owners:
    - 3e0a4456-e2a3-4ea8-9bfa-8e38ee4c863d
    - a6f30e22-f8d5-4ae8-a69c-2f81662b1950

# CoffiebagSupreme's Nether Porunga wishes (2026-10-08, session n97wtc), matched by `owner`: fully grown crops
# he breaks replant from a seed in his inventory (AutoReplant); zombies, zombie villagers, husks and drowned
# leave him alone unless he hurt that one in the last 5 minutes, plugin-spawned mobs excepted (ZombieTruce);
# food he makes fills twice as much (HeartyFood). `netherwishes owner <player>` moves all three.
nether-wishes:
  enabled: true
  owner: 7dca8f8e-2981-4925-a7d7-128395ca11b9

# Ops who never act as Towny admins (Joe, 2026-10-09, for SirBepy): on every join each gets Towny's
# "adminbypass" mode (TownyAdminOffListener), so town build/destroy/switch rules apply to them like to
# anyone; Towny forgets modes on quit. `/resident toggle adminbypass` switches it back off for the session.
# To drop everyone, put `towny-admin-off: []` in the server's file: a missing key reads this list.
towny-admin-off:
  - a6f30e22-f8d5-4ae8-a69c-2f81662b1950

# Every player-facing line, as MiniMessage. Live's config.yml predates this section; TweaksPlugin
# merges these in at runtime (copyDefaults) so an old server file still renders them, never a
# restart's "[missing message: ...]".
messages:
  wither-refusal-town: "<red>You can't summon the Wither inside a town. Take the fight to the wilderness.</red>"
  wither-refusal-nether-roof: "<red>You can't summon the Wither above the Nether roof.</red>"
  wither-refusal-unbreakable: "<red>You can't summon the Wither this close to bedrock or other blocks it can't break.</red>"
  owner-not-joined: "<player> has never joined this server."
  netherwishes-owner-set: "The Nether wishes now answer to <player> (<uuid>)."
  seagifts-flip-refused: "<aqua><gift> was switched less than an hour ago; you can switch it again in <remaining>.</aqua>"
  seagifts-flip-on: "<aqua><gift> is yours again. You can switch it off in <cooldown>.</aqua>"
  seagifts-flip-off: "<aqua><gift> is switched off. You can call it back in <cooldown>.</aqua>"
  seagifts-status-ready: "<aqua><gift>: <state>, switch it with /seagifts <key>.</aqua>"
  seagifts-status-cooldown: "<aqua><gift>: <state>, can be switched again in <wait>.</aqua>"
  seagifts-gifts-left: "<aqua>The sea's gifts left you when you died. Call them back with <commands>.</aqua>"
  seagifts-owner-already-owner: "The sea's gifts already answer to <player> (<uuid>)."
  seagifts-owner-already-not-owner: "The sea's gifts don't answer to <player> (<uuid>)."
  seagifts-owner-now-owner: "The sea's gifts now answer to <player> (<uuid>)."
  seagifts-owner-no-longer-owner: "The sea's gifts no longer answer to <player> (<uuid>)."
  hearty-food-lore: "<gold>Made by <maker>: twice as filling</gold>"
  # /changelog's book. Each page opens with the restart's heading, then one changelog-line per line.
  changelog-book-title: "Changelog"
  changelog-book-author: "ClaudeSMP"
  changelog-heading: "<bold><title></bold><newline><dark_gray><date></dark_gray>"
  changelog-heading-continued: "<bold><title> (cont.)</bold><newline><dark_gray><date></dark_gray>"
  changelog-line: "- <line>"
  changelog-empty: "Nothing in the changelog yet."
  changelog-players-only: "Only players can open the changelog book."
