# Server-list MOTD. Line 1 is fixed so the server stays recognisable in the list; line 2 is one
# entry of `daily-lines`, the same all day (server's local date) and the next entry the day after,
# wrapping around. Edits apply on the next restart. Lines from Joe's player-suggestion form.
motd:
  enabled: true
  first-line: "The Claude SMP"
  daily-lines:
    - "Sirepy"
    - "BOMBORASCLARTPUSSIBOMBOBLOODCLART EGG"
    - "Lovrinac, HEP, HDZ, ZDP, Metkovic, Judini sinovi, Daleko iza devet sela"
    - "PeePeeLooPooPoo"
    - "Danko"
    - "sirbepys sigma kingdom"
    - "the uhh sirbepsters.. or something idk man"
    - "wedge stinks"
    - "shroomsift"
    - "Los pollos minehermanos"
    - "BepyCraft"
    - "Bepy-Craft"

# CoffiebagSupreme's Shenron wish (2026-10-07): fireproof, bigger, faster phantoms, half of them
# venomous and half tougher (PhantomBuffListener). Off = vanilla phantoms after the next restart.
# The 2-night trigger and doubled spawn rate live in config/paper-world-defaults.yml, not here.
phantoms:
  enabled: true

# Bedrock parity (Joe, 2026-10-09): a Loyalty trident thrown into the void flies back to its thrower
# instead of being deleted; if the void still takes it, the item goes into the owner's inventory
# (VoidTridentListener). Tridents without Loyalty stay vanilla. Off = vanilla after the next restart.
void-tridents:
  enabled: true

# dvolic21's Shenron wish (2026-10-09, session gcg0zu): Shenron's Earthbreaker (any item tagged
# claudesmp:earthbreaker, whoever holds it) mines a 5x5 face of natural stone and ores, one block when
# sneaking, at a quarter of the dig speed while the area is on (EarthbreakerListener). Off = a normal
# pickaxe after the next restart.
earthbreaker:
  enabled: true

# Porunga's sea gifts: permanent Dolphin's Grace and Conduit Power that each owner switches for himself
# with /seagifts dolphin|conduit, each at most once per real hour; death switches both off. Owners:
# ItsLogiks (2026-10-08, session jam0yw) and SirBepy (2026-10-08, session ay4gtv). Switches and cooldowns
# live per owner in plugins/Tweaks/sea-gifts.yml. `seagifts add|remove <player>` edits the list. A single
# `owner:` key from before the list (live's config has one) still counts as an owner; add/remove drop it.
# No `owner:` default here: the jar's defaults are read for any key the server's file lacks, so one here
# would keep that player an owner past every `seagifts remove`.
sea-gifts:
  enabled: true
  owners:
    - 3e0a4456-e2a3-4ea8-9bfa-8e38ee4c863d
    - a6f30e22-f8d5-4ae8-a69c-2f81662b1950

# CoffiebagSupreme's Nether Porunga wishes (2026-10-08, session n97wtc), matched by `owner`: fully grown crops
# he breaks replant from a seed in his inventory (AutoReplant); zombies, zombie villagers, husks and drowned
# leave him alone unless he hurt that one in the last 5 minutes, plugin-spawned mobs excepted (ZombieTruce);
# food he makes fills twice as much (HeartyFood). `netherwishes owner <player>` moves all three.
nether-wishes:
  enabled: true
  owner: 7dca8f8e-2981-4925-a7d7-128395ca11b9
