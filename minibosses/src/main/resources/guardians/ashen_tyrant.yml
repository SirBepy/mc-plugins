# The Ashen Tyrant: second of the Three Ancient Guardians. All 3 tiers are real, tested fight
# content (dev.sirbepy.mc.minibosses.tyrant): Normal's ashen_tyrant_blaze_summon (BlazeSummonAbility
# - one Blaze every 5s for 3 pulses), Heroic's ashen_tyrant_blaze_wave (BlazeWaveAbility - 4 Blazes
# spawned at once) and Mythic's ashen_tyrant_ashen_storm (AshenStormAbility - an arena-wide
# fire/ash damage hazard) all fire at half health, registered in MinibossesPlugin#onEnable.
# GuardianAbilityRegistry.get() still returns empty for any id nobody registered, so a future tier
# addition that names an unimplemented id still fails safe rather than crashing the trigger path.
# Nether dimension: every periodic ability here uses a scheduler tick counter, never
# World#getFullTime(), since that call is always 0 in the Nether on this server (memory:
# nether-end-no-day-clock.md).
id: ashen_tyrant
display-name: "The Ashen Tyrant"
dimension: NETHER
description: "An ancient fortress warrior: fire attacks and blaze summons."
summon-hook: "ashen_tyrant_discovery"
tiers:
  normal:
    health: 140.0
    damage: 9.0
    abilities: ["ashen_tyrant_blaze_summon"]
    loot-table: "ashen_tyrant_normal"
  heroic:
    health: 300.0
    damage: 16.0
    abilities: ["ashen_tyrant_blaze_summon", "ashen_tyrant_blaze_wave"]
    loot-table: "ashen_tyrant_heroic"
  mythic:
    health: 560.0
    damage: 25.0
    abilities: ["ashen_tyrant_blaze_summon", "ashen_tyrant_blaze_wave", "ashen_tyrant_ashen_storm"]
    loot-table: "ashen_tyrant_mythic"
