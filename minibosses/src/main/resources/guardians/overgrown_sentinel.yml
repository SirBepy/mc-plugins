# The Overgrown Sentinel: first of the Three Ancient Guardians. Its fight is not driven by ability
# ids: the attack kit (Stonebreaker Slam, Thorn Sweep, Root Eruption, Shadow Bloom and the rest)
# lives in the per-tier phase plan in dev.sirbepy.mc.minibosses.sentinel.attack.SentinelPlans, so
# every tier's `abilities` list is empty and nothing reads it. The key stays so the file parses
# like every other Guardian's.
id: overgrown_sentinel
display-name: "The Overgrown Sentinel"
dimension: NORMAL
description: "An Overworld nature guardian: ground attacks and defensive/CC abilities."
summon-hook: "overgrown_sentinel_discovery"
tiers:
  normal:
    health: 120.0
    damage: 8.0
    abilities: []
    loot-table: "overgrown_sentinel_normal"
  heroic:
    health: 260.0
    damage: 14.0
    abilities: []
    loot-table: "overgrown_sentinel_heroic"
  mythic:
    health: 480.0
    damage: 22.0
    abilities: []
    loot-table: "overgrown_sentinel_mythic"
