# The Overgrown Sentinel: first of the Three Ancient Guardians. All 3 tiers are real, tested fight
# content (dev.sirbepy.mc.minibosses.sentinel): Normal's overgrown_sentinel_root, Heroic's
# overgrown_sentinel_thorn_vines (ThornVinesAbility - standing still near the boss gets you bitten)
# and Mythic's overgrown_sentinel_regrowth (RegrowthAbility - a healing phase that must be
# interrupted by damage) all fire at half health, registered in MinibossesPlugin#onEnable.
# GuardianAbilityRegistry.get() still returns empty for any id nobody registered, so a future tier
# addition that names an unimplemented id still fails safe rather than crashing the trigger path.
id: overgrown_sentinel
display-name: "The Overgrown Sentinel"
dimension: NORMAL
description: "An Overworld nature guardian: ground attacks and defensive/CC abilities."
summon-hook: "overgrown_sentinel_discovery"
tiers:
  normal:
    health: 120.0
    damage: 8.0
    abilities: ["overgrown_sentinel_root"]
    loot-table: "overgrown_sentinel_normal"
  heroic:
    health: 260.0
    damage: 14.0
    abilities: ["overgrown_sentinel_root", "overgrown_sentinel_thorn_vines"]
    loot-table: "overgrown_sentinel_heroic"
  mythic:
    health: 480.0
    damage: 22.0
    abilities: ["overgrown_sentinel_root", "overgrown_sentinel_thorn_vines", "overgrown_sentinel_regrowth"]
    loot-table: "overgrown_sentinel_mythic"
