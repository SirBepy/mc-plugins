# The Void Sovereign: third and final of the Three Ancient Guardians. All 3 tiers are now real,
# tested fight content (dev.sirbepy.mc.minibosses.sovereign): void_sovereign_void_step
# (VoidStepAbility, Normal - the boss blinks to a short random offset near a random nearby fighter
# every 5s, for the rest of the fight), void_sovereign_rift_zones (RiftZonesAbility, Heroic - fixed
# void-rift zones that damage and knock back anyone caught standing in them), and
# void_sovereign_void_pull (VoidPullAbility, Mythic - a periodic arena-edge pull shoving fighters
# toward the platform's exposed edges) all resolve and fire via GuardianAbilityRegistry, registered
# in MinibossesPlugin#onEnable. Solo/group scaling (SovereignScaling) and Hall-of-Fame/Guild-contract
# wiring on death also landed in this phase.
# End dimension: fully independent of endfight's own Ender Dragon fight/arena
# (endfight.arena.ArenaRegistry) - this Guardian's fight state never reads or writes that registry.
id: void_sovereign
display-name: "The Void Sovereign"
dimension: THE_END
description: "An ancient End ruler: melee, and void/teleport abilities."
summon-hook: "void_sovereign_discovery"
tiers:
  normal:
    health: 130.0
    damage: 10.0
    abilities: ["void_sovereign_void_step"]
    loot-table: "void_sovereign_normal"
  heroic:
    health: 280.0
    damage: 18.0
    abilities: ["void_sovereign_void_step", "void_sovereign_rift_zones"]
    loot-table: "void_sovereign_heroic"
  mythic:
    health: 520.0
    damage: 28.0
    abilities: ["void_sovereign_void_step", "void_sovereign_rift_zones", "void_sovereign_void_pull"]
    loot-table: "void_sovereign_mythic"
