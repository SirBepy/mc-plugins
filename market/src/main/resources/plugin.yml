name: Market
version: ${version}
main: dev.sirbepy.mc.market.MarketPlugin
api-version: "26.2"
author: sirbepy
# The Heads stall and the Wanted board pay through Vault. No Floodgate dependency: the Heads stall
# used to need it for its NPC's Bedrock body, removed 2026-10-09 now that spawn protection is off
# and the stall is sign-based like every other.
softdepend: [Vault, VaultUnlocked]

permissions:
  market.price:
    description: Use /suggested-price.
    default: true
  market.use:
    description: Use /market (today's buyers) and /market prices (the price book).
    default: true
  market.admin:
    description: Force a new set of buyers at the spawn market, and /cosmetic list/done/refund.
    default: op
  market.cosmetic:
    description: Spend a Cosmetic Token with /cosmetic <idea>.
    default: true
