name: Market
version: ${version}
main: dev.sirbepy.mc.market.MarketPlugin
api-version: "26.2"
author: sirbepy
# The Head collector pays through Vault and shows Bedrock players (Floodgate) their own body.
softdepend: [Vault, VaultUnlocked, floodgate]

permissions:
  market.price:
    description: Use /suggested-price.
    default: true
  market.use:
    description: Use /market (today's buyers) and /market prices (the price book).
    default: true
  market.admin:
    description: Force a new set of buyers at the spawn market.
    default: op
