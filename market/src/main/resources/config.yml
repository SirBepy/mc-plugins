# Market: every market day each spawn-market stall buys a random few items from its pool, shown on
# Essentials [Sell] signs. The stalls, sign spots and price pools live in stalls.yml inside the
# jar, generated by server/spawn-market/generate.mjs.

# World the spawn market stands in.
world: world

# When the stalls pick new buyers: minecraft-day (every in-game sunrise, about every 20 minutes,
# sleeping through the night counts) or real-day (midnight in the zone below).
rotate-on: minecraft-day
zone: Europe/Zagreb

# How many items each stall buys per day (capped by its pool and its sign spots).
items-per-stall:
  min: 3
  max: 3

# Each day's price is the stalls.yml price times a random factor between 1 - spread and
# 1 + spread (0.2 = up to 20% cheaper or dearer), rounded to the cent.
price-spread: 0.2

# How many mobs' heads the Head collector (the NPC at the Mob drops stall) wants each market day.
# It buys More Mob Heads' textured heads, listed with their base prices in heads.yml inside the jar,
# generated by server/market-heads/generate.mjs; each wanted mob's price rolls by price-spread too.
heads-per-day: 5

# An empty string silences a message.
messages:
  rotated: "<gold>A new day at the spawn market: the stalls are buying different things. Check the [Sell] signs at spawn."
  rotate-success: "<green>The spawn market picked new buyers."
  reload-success: "<green>Market config reloaded. Item counts and prices apply from the next rotation (/market rotate)."
  today-header: "<gold>Today the spawn market buys:"
  # /market lists each stall (and the Head collector) as a heading in its colour, then its items.
  today-heading: "<name_color><bold><name></bold></name_color>"
  today-item: " <dark_gray>-</dark_gray> <white><item></white> <gold><price></gold>"
  # The price book, on the Guide stall's lectern and from /market prices. A page fits about 14
  # short lines.
  prices-book-title: "Market prices"
  prices-book-author: "the spawn market"
  prices-book-intro: "<bold>Market prices</bold>\n\nWhat each stall and the Head collector pay on a usual day. A day's price can be up to <spread> lower or higher.\n\nEach buys only a few of these a day: /market shows today's."
  price-hold: "<gray>Hold the item you want priced in your main hand."
  price-untradeable: "<gray><item> can't be traded."
  price-unknown: "<gray>No suggested price for <item> yet."
  price-each: "<gold>Suggested price for <item>: <white><each></white>."
  price-stack: "<gold>Suggested price for <item>: <white><each></white> each, <white><stack></white> for a stack of <size>."
  # Under an enchanted item's price: the bare item, then each enchantment. Curses cut the whole price.
  price-part-item: " <dark_gray>-</dark_gray> <white><item></white> <gold><price></gold>"
  price-part-worn-item: " <dark_gray>-</dark_gray> <white><item></white> <gray>(<worn> worn)</gray> <gold><price></gold>"
  price-part-enchant: " <dark_gray>-</dark_gray> <enchant> <gold>+<price></gold>"
  price-part-curse: " <dark_gray>-</dark_gray> <enchant> <red>-<cut></red>"
  price-part-unpriced: " <dark_gray>-</dark_gray> <enchant> <gray>no suggested price</gray>"
  # The Head collector. <mobs> is today's wanted mobs, <head> the head's name.
  collector-name: "<gold>Head collector"
  collector-hold: "<gray>The Head collector buys mob heads. Today it wants <white><mobs></white> heads."
  collector-sign-head: "<gray>The Mob drops and Rare goods signs buy that head. The Head collector wants <white><mobs></white> heads today."
  collector-player-head: "<gray>The Head collector only buys mob heads, never a player's."
  collector-not-today: "<gray>No <head> today. The Head collector wants <white><mobs></white> heads."
  collector-sold: "<green>Sold <amount> <head> for <gold><total></gold>."
  collector-closed: "<red>The Head collector can't pay right now."
