  cosmetics-poor: "<red>A Cosmetic Token costs <price>. You have <balance>."
  cosmetics-closed: "<red>The Cosmetics shop can't process that right now."
  cosmetics-in-debt: "<red>You owe <debt> and can't buy anything until it's paid off."
  cosmetics-sold: "<green>You bought a Cosmetic Token!"
