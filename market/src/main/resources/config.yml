  watch-not-watching: "<gray>You're not watching <white><item></white>."
  watch-list-empty: "<gray>You're not watching anything. /market watch <item> to start."
  watch-list-header: "<gold>You're watching:"
  watch-list-line: " <dark_gray>-</dark_gray> <white><item></white>"
  watch-rotated: "<gold>Market watch:</gold> <white><item></white> is on sale today at the <white><stall></white> stall (<price>)."
  watch-join: "<gold>Market watch:</gold> <white><item></white> is still on today's market at the <white><stall></white> stall (<price>)."
  # /market price [item] (Joe, 2026-10-11): the most, usual and least a stall pays for an item.
  # <spread> the daily swing, <stall>/<amount> who buys it and how many at a time, <price> a bundle
  # price, <each> the price-range-each part (left out when the stall buys one at a time).
