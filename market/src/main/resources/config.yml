  price-range-unknown: "<gray>No spawn stall buys <white><item></white>. Tab-complete to see what they buy, or /suggested-price for what it's worth to other players."
  price-range-header: "<gold><item></gold> <gray>at the spawn market. The price moves up to <spread> each day.</gray>"
  price-range-stall: "<white><stall></white> <gray>buys <amount> at a time:</gray>"
  price-range-top: " <dark_gray>-</dark_gray> Top <gold><price></gold><each>"
  price-range-median: " <dark_gray>-</dark_gray> Median <gold><price></gold><each>"
  price-range-bottom: " <dark_gray>-</dark_gray> Bottom <gold><price></gold><each>"
  price-range-today: " <dark_gray>-</dark_gray> Today <green><price></green><each>"
