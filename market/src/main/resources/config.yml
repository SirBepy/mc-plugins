# Market: every market day each spawn-market stall buys a random few items from its pool, shown on
# Essentials [Sell] signs. The stalls, sign spots and price pools live in stalls.yml inside the
# jar, generated by server/spawn-market/generate.mjs.

# World the spawn market stands in.
world: world

# When the stalls pick new buyers: minecraft-day (every in-game sunrise, about every 20 minutes,
# sleeping through the night counts) or real-day (midnight in the zone below).
rotate-on: minecraft-day
zone: Europe/Zagreb

# How many items each stall buys per day. Each stall is still capped by its own sign count (the
# Farmer has 4 slots, every other sell stall 3), so min/max only needs to reach the biggest one.
items-per-stall:
  min: 4
  max: 4

# Each day's price is the stalls.yml price times a random factor between 1 - spread and
# 1 + spread (0.2 = up to 20% cheaper or dearer), rounded to the cent.
price-spread: 0.2

# How many mobs' heads the Heads stall wants each market day: it writes one wall sign per wanted
# mob (4 slots in stalls.yml), buying More Mob Heads' textured heads, listed with their base prices
# in heads.yml inside the jar, generated by server/market-heads/generate.mjs; each wanted mob's
# price rolls by price-spread too.
heads-per-day: 4

# Player of the Day (the Wanted board). The bounty grows with the target's play time since their
# last death: base + per-hour for each hour, times a random factor rolled once per bounty
# (1 - spread to 1 + spread), rounded to the dollar, never above cap. A fresh kill pays the value of
# the life it ended; a head taken before the bounty was posted, or never stamped at all, pays
# old-head-share of today's value. A target who plays and doesn't die before the next bounty gets
# survivor-share of their value then. online-chance: how often the target is an online player
# rather than anyone who has ever joined. A day with a bounty, claimed or not, is always followed by
# a day without one. min-online: a bounty only goes up with at least this many players online;
# otherwise that day has none and the next day tries again.
# enabled: false temporarily pulls the whole board (no new/claimed bounties, sign shows "No bounty
# today"). Flip it and run /market reload; no restart needed either way.
wanted:
  enabled: false
  base: 50
  per-hour: 25
  cap: 500
  spread: 0.1
  online-chance: 0.8
  old-head-share: 0.5
  survivor-share: 0.5
  min-online: 4

# The Homes shop sells huskhomes.max_homes.<n> above the default LuckPerms group's own .3 (Joe,
# 2026-10-09: everyone starts with 3 homes; this shop sells up to max). Each tier needs its own
# price here; raising max without adding one falls back to a plain scaling default (MarketConfig).
homes:
  max: 6
  prices:
    4: 500
    5: 1500
    6: 4000

# One Cosmetic Token: ask Claude to restyle one held item via /cosmetic <idea>.
cosmetics:
  price: 2500

# Starter Shop Boost (Joe, 2026-10-11): a player whose all-time peak net worth has never reached
# net-worth-threshold sells for max-multiplier at every spawn stall (the five Essentials [Sell]
# stalls and the Heads stall), tapering smoothly to 1x as their lifetime bonus from it approaches
# bonus-cap. Net worth only ever rises here, so a veteran who's currently broke never qualifies,
# and once bonus-cap is paid out the boost stops for good.
starter-boost:
  enabled: true
  net-worth-threshold: 5000
  max-multiplier: 3.0
  bonus-cap: 500

# An empty string silences a message.
messages:
  rotated: "<gold>A new day at the spawn market: the stalls are buying different things. Check the [Sell] signs at spawn."
  rotate-success: "<green>The spawn market picked new buyers."
  reload-success: "<green>Market config reloaded. Item counts and prices apply from the next rotation (/market rotate)."
  today-header: "<gold>Today the spawn market buys:"
  # /market lists each stall (and the Heads stall) as a heading in its colour, then its items.
  today-heading: "<name_color><bold><name></bold></name_color>"
  today-item: " <dark_gray>-</dark_gray> <white><item></white> <gold><price></gold>"
  # The price book, on the Guide stall's lectern and from /market prices. A page fits about 14
  # short lines.
  prices-book-title: "Market prices"
  prices-book-author: "the spawn market"
  prices-book-intro: "<bold>Market prices</bold>\n\nWhat each stall and the Heads stall pay on a usual day. A day's price can be up to <spread> lower or higher.\n\nEach buys only a few of these a day: /market shows today's."
  price-hold: "<gray>Hold the item you want priced in your main hand."
  price-untradeable: "<gray><item> can't be traded."
  price-unknown: "<gray>No suggested price for <item> yet."
  price-each: "<gold>Suggested price for <item>: <white><each></white>."
  price-stack: "<gold>Suggested price for <item>: <white><each></white> each, <white><stack></white> for a stack of <size>."
  # Under an enchanted item's price: the bare item, then each enchantment. Curses cut the whole price.
  price-part-item: " <dark_gray>-</dark_gray> <white><item></white> <gold><price></gold>"
  price-part-worn-item: " <dark_gray>-</dark_gray> <white><item></white> <gray>(<worn> worn)</gray> <gold><price></gold>"
  price-part-enchant: " <dark_gray>-</dark_gray> <enchant> <gold>+<price></gold>"
  price-part-curse: " <dark_gray>-</dark_gray> <enchant> <red>-<cut></red>"
  price-part-unpriced: " <dark_gray>-</dark_gray> <enchant> <gray>no suggested price</gray>"
  # The Heads stall's 4 signs. <mobs> is today's wanted mobs, <head> the head's name.
  heads-hold: "<gray>The Heads stall buys mob heads. Today it wants <white><mobs></white> heads."
  heads-sign-head: "<gray>The Mob drops and Rare goods signs buy that head. The Heads stall wants <white><mobs></white> heads today."
  heads-player-head: "<gray>The Heads stall only buys mob heads, never a player's."
  heads-not-today: "<gray>No <head> today. The Heads stall wants <white><mobs></white> heads."
  heads-sold: "<green>Sold <amount> <head> for <gold><total></gold>."
  heads-closed: "<red>The Heads stall can't pay right now."
  # The Wanted board (Player of the Day). <name> is the target, <price> and <total> whole dollars.
  wanted-none: "<gray>No bounty today."
  wanted-resting: "<gray>The board is resting. A new bounty comes tomorrow."
  wanted-claimed: "<gray>Someone already brought in <name>'s head today."
  wanted-wrong-head: "<gray>The board wants <name>'s head today."
  wanted-own-head: "<gray>You can't turn in your own head."
  wanted-closed: "<red>The board can't pay right now."
  wanted-sold-fresh: "<gold><seller></gold> brought in <gold><name></gold>'s head (fresh kill) for <green>$<price></green>!"
  wanted-sold-old: "<gold><seller></gold> brought in <gold><name></gold>'s head (old head) for <green>$<price></green>!"
  wanted-rotated: "<red>WANTED: <name>'s head, $<price> and rising while they stay alive, at the board in spawn."
  wanted-survived: "<gold><name></gold> survived the bounty and earned <green>$<price></green>!"
  today-wanted-none: " <dark_gray>-</dark_gray> <gray>No bounty today.</gray>"
  today-wanted-resting: " <dark_gray>-</dark_gray> <gray>The board is resting. A new bounty comes tomorrow.</gray>"
  today-wanted-open: " <dark_gray>-</dark_gray> <white><name></white>'s head <gold>Fresh $<price></gold> <gray>/</gray> <gold>Old $<old></gold>"
  today-wanted-claimed: " <dark_gray>-</dark_gray> <white><name></white>'s head <gray>(claimed by <seller>)</gray>"
  # The Homes shop: one sign per home (4th/5th/6th), right-click the one you're up to (Joe,
  # 2026-10-09). <n> is the home number (just bought, already owned, or needed first);
  # <price>/<balance> whole dollars.
  homes-max: "<gray>You already have the most homes this shop sells."
  homes-owned: "<gray>You already have your <n>th home."
  homes-need-earlier: "<gray>Buy your <n>th home first."
  homes-poor: "<red>That home costs <price>. You have <balance>."
  homes-closed: "<red>The Homes shop can't process that right now."
  homes-in-debt: "<red>You owe <debt> and can't buy anything until it's paid off."
  homes-success: "<green>You can now set <n> homes!"
