  cosmetic-wrong-status: "<gray>Request #<id> is already <status>."
  cosmetic-list-empty: "<gray>No pending cosmetic requests."
  cosmetic-list-line: " <dark_gray>-</dark_gray> <white>#<id></white> <gray><player></gray> <white><material></white>: <idea>"
