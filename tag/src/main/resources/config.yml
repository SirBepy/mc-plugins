# Tag plugin configuration. `/tag reload` re-reads this without a restart.

tag:
  # Projectiles (arrows, tridents) count as a tag, not just melee hits.
  allow-projectiles: false

tagback:
  # The new IT cannot immediately tag back whoever just tagged them.
  seconds: 60
  # How often the "tagback blocked" warning may repeat to the same IT player, so spam-hitting
  # the protected player doesn't spam chat.
  message-cooldown-seconds: 3

points:
  # Lowest total wins. Getting tagged costs you points (bad).
  on-tag: 10.0
  # IT gains this much per tick while online; offline IT gains base * offline-factor.
  base: 1.0
  offline-factor: 0.5
  # "log" -> 1 + step * log2(n); "linear" -> 1 + step * (n - 1). n = online players other than
  # IT who have not opted out.
  curve: log
  step: 0.5
  interval-seconds: 60

prefix:
  # MiniMessage. U+2623 BIOHAZARD SIGN, owner-picked option G.
  format: "<green>☣</green> "
  priority: 0

head:
  # Set either `material` (a plain item, e.g. "IRON_HELMET") or `texture` (a base64 player-head
  # skin). `material` wins if both are set. Leave both blank for the default sheep head below.
  material: ""
  # Default: a "Sheep" head from minecraft-heads.com (animals category). Hash mirrored via the
  # TheLuca98/MinecraftHeads GitHub CSV export of the public minecraft-heads.com API and
  # verified live against textures.minecraft.net (HTTP 200) on 2026-10-02. Vanilla has no sheep
  # head item, hence the player-head texture.
  texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHBzOi8vdGV4dHVyZXMubWluZWNyYWZ0Lm5ldC90ZXh0dXJlL2M2MDdhMzczN2U5OWYxNDI2MjQxNTJhNjg1ODhmNGJmYWZmYjhjZDNmYTk5YzE5OTcxMTU0Y2M3NGYwZGRmNzEifX19"
  # How often (seconds) to check the IT player still has the head on, in case /clear or similar
  # removed it.
  watchdog-interval-seconds: 5

afk:
  # Master switch: false disables idle sampling, multiplier exclusion, and IT auto-pass entirely.
  enabled: true
  # Idle this long (no movement/chat/command/block/interact/inventory activity) = AFK.
  threshold-seconds: 300
  # AFK players don't count toward the points multiplier's n (see points.curve above).
  exclude-from-multiplier: true
  # IT who stays idle this long passes IT to a random eligible online player.
  auto-pass: true
  it-pass-after-seconds: 600
  # Warn IT only, this many seconds before the pass. 0 disables the warning.
  it-pass-warning-seconds: 60
  # How often (seconds) to sample player position/facing for the idle check. Seconds, not
  # minutes, so an e2e can set tiny values here and `/tag reload` to test AFK handling quickly.
  check-interval-seconds: 1
  # AFK players can't be tagged. Sent to IT when they hit one (rate-limited by
  # tagback.message-cooldown-seconds). Blank silences it.
  untaggable-message: "<gray><player> is AFK and can't be tagged.</gray>"

tracker:
  # IT carries a compass that points at a chosen player (nearest by default); right-click cycles.
  # It stays in IT's own inventory and vanishes when IT passes. Opted-out, creative and spectator
  # players are never tracked.
  enabled: true
  # How often the compass re-points and the action bar refreshes. The action bar fades after ~3s,
  # so keep this well under 60.
  update-interval-ticks: 10
  item-name: "<green>☣ Tag Tracker</green>"
  item-lore: "<gray>Right-click to switch player</gray>"
  # Action bar while the compass is in either hand. <player>, <distance> (blocks).
  readout:
    distance: "<white><player></white> <gray>-</gray> <yellow><distance>m</yellow>"
    other-realm: "<white><player></white> <gray>- Not in this realm</gray>"
    afk: "<white><player></white> <gray>- AFK, can't be tagged</gray>"
    nobody: "<gray>No one to track</gray>"

teleport-block:
  # Opted-in survival/adventure players within `radius` blocks of IT (same world) can't escape by
  # command or plugin teleport: /home, /tpa, /back, /spawn, /warp, /rtp and the like. Ender pearls,
  # chorus fruit and portals still work. IT, opted-out players, and anyone near an AFK IT are free.
  enabled: true
  radius: 100
  # <it>, <radius>. Blank silences it (the teleport is still blocked).
  message: "<red>You're within <radius> blocks of IT (<it>), so you can't teleport away.</red>"

leaderboard:
  # The in-world TextDisplay placed by `/tag leaderboard place`. Distinct from the chat-only
  # messages.leaderboard-header/entry used by `/tag top`.
  size: 10
  billboard: CENTER
  scale: 0.75
  line-width: 250
  see-through: false
  board:
    header: "<gold><bold>Tag leaderboard</bold></gold> <gray>(lowest wins)</gray>"
    entry: "<gray><rank>.</gray> <white><player></white> <yellow><points></yellow>"
    footer: "<gray>IT: <green>☣</green> <it></gray>"
    # Shown in the footer's <it> when nobody is currently IT.
    nobody: "nobody"
    # Shown between the header and footer when nobody has stats yet.
    empty: "<gray>No points yet.</gray>"

messages:
  unknown-player: "<red>Unknown player: <player>.</red>"
  it-set-confirm: "<green><player> is now IT.</green>"
  it-cleared-confirm: "<green>IT cleared.</green>"
  opted-out: "<yellow>You opted out of Tag. You can no longer be tagged.</yellow>"
  already-opted-out: "<gray>You are already opted out.</gray>"
  cannot-optout-as-it: "<red>You are IT and cannot opt out. Wait to be tagged or ask an admin.</red>"
  opted-in: "<green>You opted back into Tag.</green>"
  already-opted-in: "<gray>You are already opted in.</gray>"
  board-enabled: "<green>Tag sidebar enabled.</green>"
  board-disabled: "<gray>Tag sidebar disabled.</gray>"
  board-blocked: "<red>Another sidebar is already showing. Close it first, then try /tag board again.</red>"
  nobody-it: "<gray>Nobody is IT right now.</gray>"
  who-is-it: "<yellow><it> is IT.</yellow>"
  reloaded: "<green>Tag config reloaded.</green>"
  stats-line: "<aqua><player> - points: <points>, tagged: <tagged>, tags made: <made>, minutes IT (online/offline): <minutes-online>/<minutes-offline></aqua>"
  leaderboard-header: "<gold>Tag leaderboard (lowest wins):</gold>"
  leaderboard-entry: "<white><rank>. <player> - <points></white>"
  afk-warning: "<yellow>You've been idle as IT. Move within <seconds>s or IT passes to someone else.</yellow>"
  leaderboard-player-only: "<red>Run this in-game as the player who should stand where the board goes.</red>"
  leaderboard-placed: "<green>Leaderboard placed.</green>"
  leaderboard-removed: "<gray>Leaderboard removed.</gray>"
  leaderboard-none: "<gray>There is no leaderboard to remove.</gray>"

# Placeholders available per event: <tagger>, <tagged>, <it>, <points>, <player>, <old_it>, <new_it>.
logs:
  tag:
    enabled: true
    broadcast: true
    console: true
    format: "<yellow><tagger> tagged <tagged>! <tagged> is now IT.</yellow>"
  tagback-blocked:
    # Always sent only to the tagger, never broadcast, regardless of this flag.
    enabled: true
    broadcast: false
    console: false
    # <seconds>: time left on the tagback cooldown.
    format: "<gray>You can't tag <player> back for another <seconds>s.</gray>"
  it-set:
    enabled: true
    broadcast: true
    console: true
    format: "<yellow><player> made <it> IT.</yellow>"
  it-cleared:
    enabled: true
    broadcast: true
    console: true
    format: "<yellow><player> cleared IT.</yellow>"
  it-joined:
    enabled: true
    broadcast: false
    console: true
    format: "<gray><it> (IT) joined.</gray>"
  it-quit:
    enabled: true
    broadcast: false
    console: true
    format: "<gray><it> (IT) left. They stay IT until they return.</gray>"
  opt-out:
    enabled: false
    broadcast: false
    console: true
    format: "<gray><player> opted out of Tag.</gray>"
  opt-in:
    enabled: false
    broadcast: false
    console: true
    format: "<gray><player> opted into Tag.</gray>"
  it-afk-passed:
    enabled: true
    broadcast: true
    console: true
    format: "<gray><old_it> was away too long, IT passed to <new_it>.</gray>"
