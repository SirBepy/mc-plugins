# Names plugin configuration. /names reload re-reads this file without a restart.

chat:
  # Placeholders: <prefixes> <name> <message>
  format: "<prefixes><name><gray>: </gray><message>"

nickname:
  max-length: 16
  # Letters, digits, underscore and space only.
  allowed-pattern: "^[A-Za-z0-9_ ]+$"

bedrock:
  # Bedrock players (Floodgate) get a Cumulus input form for /nick instead of the anvil GUI,
  # which Bedrock's UI can't render. Ignored when Floodgate isn't installed.
  forms: true
  # A prefix on Bedrock players' names in chat, the tab list and above their heads (not in
  # Discord or other plugins' messages). Floodgate's "." stays in the name after it.
  tag:
    enabled: true
    # MiniMessage. Gray, Joe's pick (2026-10-09).
    format: "<gray>[BE]</gray> "
    # Lower renders further left. Tag's IT marker is 0, so a Bedrock IT reads "[BE] ☣ Name".
    priority: -10

label:
  # How far above the mount point (the player's head, since the display rides the player) the
  # floating text sits. Tuned by eye in-game; see FloatingLabelManager.
  offset-y: 0.35
  # false = fully transparent background, matching a vanilla nametag's look.
  use-default-background: false
  see-through: false

palette:
  # The 16 vanilla named colors, offered to everyone.
  named:
    - black
    - dark_blue
    - dark_green
    - dark_aqua
    - dark_red
    - dark_purple
    - gold
    - gray
    - dark_gray
    - blue
    - green
    - aqua
    - red
    - light_purple
    - yellow
    - white
  # A curated set of extra hex colors, offered to everyone.
  hex:
    - name: "Amber"
      value: "#FF8C00"
    - name: "Teal"
      value: "#00CED1"
    - name: "Rose"
      value: "#FF1493"
    - name: "Chartreuse"
      value: "#7FFF00"
    - name: "Violet"
      value: "#9370DB"
    - name: "Sea Green"
      value: "#2E8B57"
  # Gradients, behind names.color.gradient.
  gradients:
    - name: "Sunset"
      from: "#FF512F"
      to: "#F09819"
    - name: "Ocean"
      from: "#2193B0"
      to: "#6DD5ED"
    - name: "Candy"
      from: "#FF6A00"
      to: "#EE0979"

messages:
  no-permission: "<red>You don't have permission to do that.</red>"
  player-only: "<red>Only a player can run that command.</red>"
  color-gui-title: "<dark_gray>Choose a color"
  color-gui-apply-hint: "<gray>Click to apply</gray>"
  color-gui-reset: "<gray>Reset</gray>"
  color-applied: "<green>Color applied.</green>"
  color-reset: "<green>Color reset to default.</green>"
  gradient-no-permission: "<red>You don't have permission to use gradients.</red>"
  nick-gui-title: "<dark_gray>Type a nickname"
  nick-form-title: "Nickname"
  nick-form-label: "Type your new nickname (empty = cancel)"
  nick-usage: "<red>Usage: /nick <name|reset>, or /nick with no arguments to open the editor.</red>"
  nick-set: "<green>Nickname set to <white><nick></white>.</green>"
  nick-set-other: "<green>Set <white><target></white>'s nickname to <white><nick></white>.</green>"
  nick-reset: "<green>Nickname reset.</green>"
  nick-reset-other: "<green>Reset <white><target></white>'s nickname.</green>"
  nick-blank: "<red>A nickname can't be blank.</red>"
  nick-too-long: "<red>Nicknames can be at most <max> characters.</red>"
  nick-bad-chars: "<red>Nicknames may only contain letters, digits, underscores and spaces.</red>"
  nick-impersonation: "<red>That nickname is already a player's real name.</red>"
  nick-player-not-found: "<red>No player named <target> was found.</red>"
  reload-done: "<green>Names reloaded.</green>"
  reload-usage: "Usage: /names reload"
